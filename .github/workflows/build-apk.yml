name: Build & Sign LAMP TIK Native Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Certificate of the shipping release key (SHA-256, lowercase). Every build
  # must match it: a different certificate means installed users cannot
  # upgrade over the top and the release is not the one the site advertises.
  EXPECTED_CERT_SHA256: "7c62387530166f868513604b3c0b5b1cedbf5083d7be5717cd5c6410aba5a381"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build-Tools 35
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0"

      # The release key lives at android-app/release-key.jks, COMMITTED, so the
      # same identity is used on every build. An ANDROID_KEYSTORE_BASE64 secret
      # (rotation path) overrides it when present; with neither, the job fails
      # rather than minting a key that can never update an installed app.
      - name: Resolve the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p android-app
            printf '%s' "$KEYSTORE_B64" | base64 -d > android-app/release-key.jks
          elif [ ! -f android-app/release-key.jks ]; then
            echo "::error::No release key: android-app/release-key.jks is missing and ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

      # The app is framework-only (no Gradle, no AndroidX): aapt2 -> javac ->
      # d8 -> PackAssets -> zipalign -> apksigner, all driven by one script so
      # CI and a local build produce the exact same binary.
      - name: Build & sign the native APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash android-app/build-native-apk.sh

      - name: Verify signature, manifest and size
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="public/downloads/lamptik-v3.5.apk"
          "$BT/apksigner" verify --min-sdk-version 21 --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|launchable-activity:"
          cert=$("$BT/apksigner" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          echo "certificate: $cert"
          test "$cert" = "$EXPECTED_CERT_SHA256"
          unzip -l "$APK" | grep -E "classes.dex|assets/fonts/|assets/art/"
          bytes=$(stat -c%s "$APK")
          echo "APK size: $bytes bytes"
          test "$bytes" -ge 3145728
          test "$bytes" -le 6291456

      - name: Commit & push the signed APK
        run: |
          set -euo pipefail
          git config user.name "mk6783336"
          git config user.email "mk6783336@users.noreply.github.com"
          git add public/downloads/lamptik-v3.5.apk \
                  public/downloads/lamptik-v3.4.apk \
                  public/downloads/lamptik-v3.3.apk \
                  public/downloads/lamptik-v3.2.apk \
                  public/downloads/lamptik-v3.1.apk \
                  public/downloads/lamptik-v3.0.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore(android): rebuild signed native lamptik-v3.5.apk [skip ci]"
            git push origin HEAD:main
          fi
