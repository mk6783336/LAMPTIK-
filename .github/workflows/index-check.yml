name: Index Check

# Weekly indexing health report. Exists because "is the site in Bing yet?" could
# only be answered by running `site:` queries by hand.
#
# The report always covers what is reliably measurable without an account:
# sitemap size, robots.txt admission of Bingbot, and whether Bing Webmaster
# verification is configured. Indexed-page counts are included only when the
# engine proves it is answering honestly — each `site:` query is validated
# against a control domain, because Bing serves unrelated filler results to
# automated clients and a naive scrape reads that as "0 indexed".
#
# Optional secret: BING_WEBMASTER_API_KEY. Without it the job still reports
# sitemap, robots and verification status; the index count just stays
# unmeasurable, because no public endpoint will answer that question.
#
# The report lands in the run's Summary tab. Scheduled workflows are disabled by
# GitHub after 60 days without repository activity — if this goes quiet for two
# months, re-enable it from the Actions tab.

on:
  schedule:
    # Mondays 06:00 UTC. A week is the shortest interval that can distinguish a
    # crawl from a crawl-in-progress for a site this size.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The previous run's state is the baseline, so never cancel one mid-flight.
concurrency:
  group: index-check
  cancel-in-progress: false

jobs:
  measure:
    name: Measure index presence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Restores the run history so the report can show a delta. The per-run key
      # makes the cache always writable; restore-keys picks up the newest prior.
      - uses: actions/cache@v4
        with:
          # Index history and the submission ledger share one cache so both
          # survive between weekly runs.
          path: |
            .index-check-state.json
            .bing-submit-state.json
          key: index-check-state-${{ github.run_id }}
          restore-keys: |
            index-check-state-

      - name: Measure Bing and DuckDuckGo
        env:
          INDEX_CHECK_ORIGIN: https://www.lamptik.online
          # Optional. When present, Bing is measured through the Webmaster API
          # against our own sitemap URLs — the only authoritative source. When
          # absent the job still runs and reports everything else; it simply
          # cannot produce a Bing index count. Add it under
          # Settings → Secrets → Actions after generating a key in
          # Bing Webmaster Tools → Settings → API access.
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/index-check.mjs

      # Pushes only URLs Bing has never been told about. A blanket re-submit of
      # all 51 every week would spend the 200/month quota in four weeks and
      # train Bing to ignore the signal, so `--new-only` is what keeps this
      # sustainable; the staleness window re-nudges pages Bing accepted and then
      # ignored. Skipped entirely when the key is absent.
      - name: Submit new URLs to Bing
        env:
          INDEX_CHECK_ORIGIN: https://www.lamptik.online
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/bing-submit.mjs --new-only --stale-after-days 30 --skip-if-unconfigured
