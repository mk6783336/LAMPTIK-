services:
  - type: web
    name: lamptik-ytdlp
    runtime: docker
    plan: free
    region: singapore
    dockerContext: bridge
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # `sync: false` prompts for the value instead of generating one: the
      # backup must authenticate with the SAME secret Vercel already sends as
      # `x-bridge-secret`. A generated value makes every /resolve answer 401,
      # so the failover would look deployed and still be useless.
      - key: BRIDGE_SECRET
        sync: false
