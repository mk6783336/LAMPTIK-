plugins {
    id 'com.android.application'
}

android {
    namespace 'online.lamptik.app'
    compileSdk 34

    defaultConfig {
        applicationId "online.lamptik.app"
        minSdk 24
        targetSdk 34
        // Keep in sync with android-app/build-native-apk.sh (the CI build).
        versionCode 32
        versionName "3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
