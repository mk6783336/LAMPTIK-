plugins {
    id 'com.android.application'
}

android {
    namespace 'online.lamptik.pro'
    compileSdk 34

    defaultConfig {
        applicationId "online.lamptik.pro"
        minSdk 24
        targetSdk 33
        // Keep in sync with android-app/build-native-apk.sh (the CI build).
        versionCode 35
        versionName "3.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
